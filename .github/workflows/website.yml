name: Website (build and publish)

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  push:
    branches: [ main ]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_NODE_TYPE: node24
  REGISTRY: ghcr.io
  IMAGE_NAME_WEBSITE: ${{ github.repository_owner }}/flashagenda-website

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install website dependencies
        working-directory: ./website
        run: npm ci

      # Fails on dead internal links
      - name: Build website
        working-directory: ./website
        run: npm run build

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Website
        id: meta-website
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WEBSITE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      # Build context is the repository root: the site reads the app version from frontend/package.json
      - name: Build and push Website Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./website/Dockerfile
          push: true
          tags: ${{ steps.meta-website.outputs.tags }}
          labels: ${{ steps.meta-website.outputs.labels }}
          cache-from: type=gha,scope=website
          cache-to: type=gha,mode=max,scope=website
