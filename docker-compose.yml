services:
  mongodb:
    image: mongo:4.4
    container_name: flashagenda-mongo
    ports:
      - "30303:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  backend:
    image: ghcr.io/marc2016/flashagenda-backend:latest
    build:
      context: ./backend
    container_name: flashagenda-backend
    ports:
      - "30302:3001"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/flashagenda
      - PORT=3001
      # Number of proxies in front of the backend: 1 = only the frontend nginx, 2 = reverse proxy + nginx
      - TRUST_PROXY=${TRUST_PROXY:-1}
      # Passkeys (WebAuthn): the public domain and origin(s) of the app, e.g. agenda.example.org / https://agenda.example.org
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-localhost}
      - WEBAUTHN_ORIGIN=${WEBAUTHN_ORIGIN:-http://localhost:30301}
      - WEBAUTHN_RP_NAME=${WEBAUTHN_RP_NAME:-FlashAgenda}
    depends_on:
      - mongodb
    restart: unless-stopped

  frontend:
    image: ghcr.io/marc2016/flashagenda-frontend:latest
    build:
      context: ./frontend
    container_name: flashagenda-frontend
    ports:
      - "30301:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo-data:
